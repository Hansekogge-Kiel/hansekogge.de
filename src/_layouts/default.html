<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  {% seo title=false %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#inhalt">Zum Inhalt springen</a>
  {% include header.html %}
  <main id="inhalt">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
